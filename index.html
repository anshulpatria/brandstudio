// ═══ GROWTH-BASED PATTERN GENERATION ═══
// Range-based: cells fill when distance is between min and max
// Organic holes punched via secondary noise
function generateGrowthGrid(rows, cols, cMin, cMax, seed = 42) {
  const rng = v => {
    v = Math.sin(v * 127.1 + seed * 311.7) * 43758.5;
    return v - Math.floor(v);
  };
  const rng2 = v => {
    v = Math.sin(v * 269.3 + seed * 183.1) * 29471.7;
    return v - Math.floor(v);
  };
  const grid = [];
  for (let r = 0; r < rows; r++) {
    const row = [];
    for (let c = 0; c < cols; c++) {
      const nr = r / rows,
        nc = c / cols;

      // Distance from nearest corner (0 at corners, ~1 at center)
      const d1 = Math.sqrt(nr * nr + nc * nc);
      const d2 = Math.sqrt(nr * nr + (1 - nc) * (1 - nc));
      const d3 = Math.sqrt((1 - nr) * (1 - nr) + nc * nc);
      const d4 = Math.sqrt((1 - nr) * (1 - nr) + (1 - nc) * (1 - nc));
      let dist = Math.min(d1, d2, d3, d4) / 0.707;

      // Organic edge noise
      const noise = (rng(r * cols + c) - 0.5) * 0.22;
      const t = dist + noise;

      // Cell fills when distance falls within [cMin, cMax] range
      const inRange = t >= cMin && t < cMax;

      // Punch organic holes — ~15% of in-range cells get removed
      const hole = rng2(r * cols + c + seed * 7) < 0.15;
      row.push(inRange && !hole ? 1 : 0);
    }
    grid.push(row);
  }
  return grid;
}

// Generate grid growing from left edge to right
function generateLeftGrowthGrid(rows, cols, cMin, cMax, seed = 42) {
  const rng = v => {
    v = Math.sin(v * 127.1 + seed * 311.7) * 43758.5;
    return v - Math.floor(v);
  };
  // fillTo = how many columns from left are fully solid (65-75% of coverage)
  const coverageCols = Math.round(cols * cMax);
  const solidCols = Math.round(coverageCols * 0.7); // 70% of covered area is solid
  const grid = [];
  for (let r = 0; r < rows; r++) {
    const row = [];
    // Per-row organic edge variation
    const rowNoise = Math.round((rng(r * 137 + seed * 41) - 0.5) * 3);
    const rowSolid = Math.max(0, Math.min(cols, solidCols + rowNoise));
    const rowMax = Math.max(0, Math.min(cols, coverageCols + Math.round((rng(r * 73 + seed * 19) - 0.5) * 2)));
    for (let c = 0; c < cols; c++) {
      if (c < rowSolid) {
        // Solid fill zone — always filled
        row.push(1);
      } else if (c < rowMax) {
        // Organic edge zone — some cells filled, some gaps
        const edgeChance = 1 - (c - rowSolid) / Math.max(rowMax - rowSolid, 1);
        row.push(rng(r * cols + c + seed * 3) < edgeChance * 0.7 ? 1 : 0);
      } else {
        row.push(0);

// ═══ GENERATE COPY (Claude API) ═══
async function generateCopy(context, apiKey) {
  if (!apiKey) {
    alert("Enter your Anthropic API key in the field below Generate Copy.");
    return null;
  }
  try {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        messages: [{
          role: "user",
          content: `You are a copywriter for hay.ag, an agricultural data platform. Generate creative copy for a marketing visual.

Context: ${context || "General brand awareness for an agritech platform"}

Respond ONLY with valid JSON, no markdown backticks:
{"headline":"Short punchy headline with line break (use \\n), max 5 words","body":"One compelling sentence, max 20 words","cta":"CTA button text, 2-3 words"}`
        }]
      })
    });
    const data = await response.json();
    const text = data.content?.map(b => b.text || "").join("") || "";
    return JSON.parse(text.replace(/```json|```/g, "").trim());
  } catch (e) {
    console.error("Copy generation failed:", e);
    alert("Copy generation failed. Check your API key and try again.");
    return null;
  }
}
